[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "wmguru"
version = "0.1.0"
requires-python = ">= 3.11"
dependencies = [
    "pandas",
    "scipy",
    "numpy",
    "pydantic",
    "pytest",
    "black",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]
extend-exclude = [
    # Simulation scripts that belong to the concept paper, not to the pipeline.
    "docs",
]

[tool.ruff.lint]
select = ["D", "E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # D203 and D213 contradict D211 and D212, which are the ones we follow.
    "D203",
    "D213",
    # An __init__ that only stores what was injected says nothing a docstring
    # could add; the class docstring already covers it (CLAUDE.md section 8).
    "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# A test says what it checks through its name, a docstring would only repeat it.
"tests/*" = ["D103"]